<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#010101" rx="20" />
  <rect width="1200" height="630" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" rx="20" />

  <!-- Header -->
  <g transform="translate(60, 60)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#EDEDED">
      Pay<tspan fill="#FF2E51">X</tspan>a Direct-to-Merchant Payment Flow
    </text>
    <text y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#737373">
      Zero Intermediary Pooling · Instant Push Notification · Server-Authoritative Reconciliation
    </text>
  </g>

  <!-- Step 1: Customer Checkout -->
  <g transform="translate(60, 160)">
    <rect width="220" height="380" rx="16" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />
    <circle cx="110" cy="50" r="28" fill="#141414" stroke="#FF2E51" stroke-width="2" />
    <text x="110" y="56" text-anchor="middle" font-family="monospace" font-size="20" fill="#FF2E51">01</text>
    <text x="110" y="110" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="16" fill="#EDEDED">Customer Checkout</text>
    <text x="110" y="140" text-anchor="middle" font-family="system-ui" font-size="13" fill="#888888">Scans Dynamic QR or</text>
    <text x="110" y="160" text-anchor="middle" font-family="system-ui" font-size="13" fill="#888888">launches UPI app</text>
    
    <rect x="30" y="200" width="160" height="130" rx="10" fill="#111111" stroke="#222222" />
    <text x="110" y="240" text-anchor="middle" font-family="monospace" font-size="12" fill="#FF2E51">Google Pay / PhonePe</text>
    <text x="110" y="270" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF">Paytm / BHIM / Cred</text>
    <text x="110" y="300" text-anchor="middle" font-family="system-ui" font-size="11" fill="#777777">Direct UPI VPA</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M290 350 L340 350" stroke="#FF2E51" stroke-width="3" stroke-dasharray="6 6" />
  <polygon points="345,350 335,344 335,356" fill="#FF2E51" />

  <!-- Step 2: Direct Fund Settlement -->
  <g transform="translate(350, 160)">
    <rect width="220" height="380" rx="16" fill="#0A0A0A" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="110" cy="50" r="28" fill="#141414" stroke="#00E5FF" stroke-width="2" />
    <text x="110" y="56" text-anchor="middle" font-family="monospace" font-size="20" fill="#00E5FF">02</text>
    <text x="110" y="110" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="16" fill="#EDEDED">Direct Settlement</text>
    <text x="110" y="140" text-anchor="middle" font-family="system-ui" font-size="13" fill="#888888">Funds land directly in</text>
    <text x="110" y="160" text-anchor="middle" font-family="system-ui" font-size="13" fill="#888888">Merchant receiving account</text>

    <rect x="30" y="200" width="160" height="130" rx="10" fill="#111111" stroke="#222222" />
    <text x="110" y="250" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="14" fill="#00E5FF">₹ 0 Escrow Delay</text>
    <text x="110" y="280" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888888">PayXa never holds or</text>
    <text x="110" y="300" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888888">pools merchant money</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M580 350 L630 350" stroke="#00E5FF" stroke-width="3" stroke-dasharray="6 6" />
  <polygon points="635,350 625,344 625,356" fill="#00E5FF" />

  <!-- Step 3: Companion Phone Alert -->
  <g transform="translate(640, 160)">
    <rect width="220" height="380" rx="16" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />
    <circle cx="110" cy="50" r="28" fill="#141414" stroke="#FFD600" stroke-width="2" />
    <text x="110" y="56" text-anchor="middle" font-family="monospace" font-size="20" fill="#FFD600">03</text>
    <text x="110" y="110" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="16" fill="#EDEDED">Instant Phone Alert</text>
    <text x="110" y="140" text-anchor="middle" font-family="system-ui" font-size="13" fill="#888888">PayXa Merchant Android</text>
    <text x="110" y="160" text-anchor="middle" font-family="system-ui" font-size="13" fill="#888888">companion device alerts</text>

    <rect x="30" y="200" width="160" height="130" rx="10" fill="#111111" stroke="#222222" />
    <text x="110" y="245" text-anchor="middle" font-family="monospace" font-size="12" fill="#FFD600">Payment Started</text>
    <text x="110" y="275" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888888">Incoming credit alert</text>
    <text x="110" y="295" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888888">observed &amp; hashed</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M870 350 L920 350" stroke="#FFD600" stroke-width="3" stroke-dasharray="6 6" />
  <polygon points="925,350 915,344 915,356" fill="#FFD600" />

  <!-- Step 4: Server Verification & Webhook -->
  <g transform="translate(930, 160)">
    <rect width="210" height="380" rx="16" fill="#0A0A0A" stroke="#00E676" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="105" cy="50" r="28" fill="#141414" stroke="#00E676" stroke-width="2" />
    <text x="105" y="56" text-anchor="middle" font-family="monospace" font-size="20" fill="#00E676">04</text>
    <text x="105" y="110" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="16" fill="#EDEDED">Server Reconciliation</text>
    <text x="105" y="140" text-anchor="middle" font-family="system-ui" font-size="13" fill="#888888">Order verified with</text>
    <text x="105" y="160" text-anchor="middle" font-family="system-ui" font-size="13" fill="#888888">trusted bank confirmation</text>

    <rect x="25" y="200" width="160" height="130" rx="10" fill="#111111" stroke="#222222" />
    <text x="105" y="245" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E676">payment.verified</text>
    <text x="105" y="275" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888888">HMAC signed webhook</text>
    <text x="105" y="295" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888888">dispatched to merchant</text>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="1140" y="590" text-anchor="end" font-family="system-ui" font-weight="600" font-size="14" fill="#444444">
    Official Platform Documentation · https://payxa.in
  </text>
</svg>
